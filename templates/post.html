<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="$description$" />
    <title>$title$ · Moritz Piening</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="$root$/styles.css" />
    $if(math)$
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    $endif$
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="$root$/index.html" aria-label="Moritz Piening, home">MP<span>.</span></a>
      <nav class="tabs" aria-label="Primary navigation">
        <a href="$root$/index.html">Main</a>
        <a href="$root$/blog.html" aria-current="page">Blog</a>
        <a href="$root$/ratings.html">Rating Stuff</a>
      </nav>
    </header>
    <main class="post-shell shell">
      <article>
        <header class="post-header">
          <p class="post-topline">$for(tags)$$tags$$sep$ · $endfor$</p>
          <h1>$title$</h1>
          $if(description)$<p class="post-deck">$description$</p>$endif$
          <p class="post-meta"><span class="draft-badge">$status$</span> Updated $updated$</p>
        </header>
        $if(toc)$
        <details class="post-toc">
          <summary>Contents</summary>
          $table-of-contents$
        </details>
        $endif$
        <div class="post-body">
$body$
        </div>
      </article>
    </main>
    <footer class="site-footer shell">
      <p>Moritz Piening <span>·</span> Göttingen, Germany</p>
      <a href="$root$/blog.html">Blog</a>
    </footer>
  </body>
</html>
